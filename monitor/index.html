<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orchestrate Monitor</title>
<style>
:root {
  --bg: #f4f4f2; --panel: #ffffff; --inset: #ecebe7; --line: #e2e1dc;
  --ink: #16161a; --muted: #5d5d63; --faint: #8b8b91;
  --run: #1f7a4d; --run-soft: #dff1e7; --idle: #8b8b91; --fail: #b3261e; --fail-soft: #fbe4e2;
  --architect: #6b4fd8; --architect-soft: #ece7fd; --engineer: #2463c4; --engineer-soft: #e2ecfb;
  --qa: #1f7a4d; --qa-soft: #dff1e7; --other: #5d5d63; --other-soft: #ecebe7;
  --focus: #2463c4;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111114; --panel: #1a1a1f; --inset: #24242b; --line: #2e2e36;
    --ink: #ededf0; --muted: #a3a3ad; --faint: #7c7c86;
    --run: #4cc38a; --run-soft: #173326; --idle: #7c7c86; --fail: #ff8a80; --fail-soft: #3a1c1a;
    --architect: #a993ff; --architect-soft: #2a2245; --engineer: #7fb0ff; --engineer-soft: #1c2a44;
    --qa: #4cc38a; --qa-soft: #173326; --other: #a3a3ad; --other-soft: #24242b;
    --focus: #7fb0ff; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111114; --panel: #1a1a1f; --inset: #24242b; --line: #2e2e36;
  --ink: #ededf0; --muted: #a3a3ad; --faint: #7c7c86;
  --run: #4cc38a; --run-soft: #173326; --idle: #7c7c86; --fail: #ff8a80; --fail-soft: #3a1c1a;
  --architect: #a993ff; --architect-soft: #2a2245; --engineer: #7fb0ff; --engineer-soft: #1c2a44;
  --qa: #4cc38a; --qa-soft: #173326; --other: #a3a3ad; --other-soft: #24242b;
  --focus: #7fb0ff; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-variant-numeric: tabular-nums; }
::selection { background: var(--engineer-soft); color: var(--ink); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
button { font: inherit; color: inherit; }
.mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12.5px; }
header { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 16px; padding: 14px 24px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
header h1 { font-size: 16px; font-weight: 650; margin: 0; letter-spacing: -0.01em; }
.pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--run); box-shadow: 0 0 0 0 var(--run); animation: pulse 2s ease-out infinite; flex: none; }
.pulse.stale { background: var(--idle); animation: none; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--run) 60%, transparent); } 100% { box-shadow: 0 0 0 7px transparent; } }
@media (prefers-reduced-motion: reduce) { .pulse, .dot.running { animation: none !important; } }
.updated { color: var(--muted); font-size: 13px; }
.spacer { flex: 1; }
.controls { display: flex; gap: 8px; align-items: center; }
.seg { display: inline-flex; background: var(--inset); border-radius: 9px; padding: 3px; }
.seg button { border: 0; background: transparent; padding: 5px 10px; border-radius: 7px; cursor: pointer; color: var(--muted); font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
label.toggle { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); font-size: 13px; cursor: pointer; }
main { display: grid; grid-template-columns: minmax(280px, 360px) 1fr; gap: 20px; padding: 20px 24px 40px; align-items: start; }
@media (max-width: 900px) { main { grid-template-columns: minmax(0, 1fr); padding: 16px; } header { padding: 12px 16px; flex-wrap: wrap; } }
.list { display: flex; flex-direction: column; gap: 8px; position: sticky; top: 68px; max-height: calc(100vh - 88px); overflow: auto; padding-right: 2px; }
@media (max-width: 900px) { .list { position: static; max-height: none; } }
.session { text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 12px; padding: 12px 14px; cursor: pointer; display: grid; gap: 6px; }
.session:hover { border-color: color-mix(in srgb, var(--ink) 25%, var(--line)); }
.session[aria-current="true"] { border-color: var(--engineer); box-shadow: inset 3px 0 0 var(--engineer); }
.session .top { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12.5px; }
.session .title { font-weight: 560; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.session .meta { display: flex; gap: 10px; color: var(--faint); font-size: 12.5px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--idle); flex: none; }
.dot.running { background: var(--run); animation: pulse 2s ease-out infinite; }
.dot.done { background: var(--muted); }
.dot.failed { background: var(--fail); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; }
.detail { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; min-width: 0; }
.facts b { overflow-wrap: anywhere; }
.detail h2 { margin: 0 0 6px; font-size: 18px; letter-spacing: -0.01em; font-weight: 650; overflow-wrap: anywhere; }
.facts { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--muted); font-size: 13px; }
.facts b { color: var(--ink); font-weight: 560; }
h3 { margin: 0 0 12px; font-size: 13px; font-weight: 650; color: var(--muted); }
.stages { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; margin-bottom: 14px; }
.stage { padding: 8px 6px 6px; border-top: 3px solid var(--line); font-size: 12.5px; color: var(--faint); }
.stage.done { border-color: color-mix(in srgb, var(--run) 55%, var(--line)); color: var(--muted); }
.stage.now { border-color: var(--run); color: var(--ink); font-weight: 600; }
.stage.stopped { border-color: var(--fail); color: var(--fail); font-weight: 600; }
@media (max-width: 600px) { .stages { grid-template-columns: repeat(3, 1fr); } }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-weight: 560; color: var(--faint); font-size: 12px; padding: 0 10px 8px 0; white-space: nowrap; }
td { padding: 9px 10px 9px 0; border-top: 1px solid var(--line); vertical-align: top; }
.scroll { overflow-x: auto; }
tr.agent { cursor: pointer; }
tr.agent:hover td { background: color-mix(in srgb, var(--inset) 55%, transparent); }
tr.agent[aria-selected="true"] td { background: var(--inset); }
.badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; background: var(--other-soft); color: var(--other); }
.badge.architect { background: var(--architect-soft); color: var(--architect); }
.badge.engineer { background: var(--engineer-soft); color: var(--engineer); }
.badge.qa { background: var(--qa-soft); color: var(--qa); }
.verdict { font-weight: 650; font-size: 12px; }
.verdict.PASS { color: var(--run); } .verdict.FAIL, .verdict.BLOCKED { color: var(--fail); }
.status { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; color: var(--muted); }
.action { color: var(--muted); max-width: 46ch; overflow-wrap: anywhere; }
.num { text-align: right; white-space: nowrap; }
th.num { text-align: right; }
.muted { color: var(--muted); }
.empty { color: var(--muted); padding: 24px 4px; }
details summary { cursor: pointer; color: var(--muted); font-size: 13px; }
pre { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--inset); padding: 12px; border-radius: 10px; margin: 8px 0 0; max-height: 360px; overflow: auto; }
.drawer { display: grid; gap: 12px; scroll-margin-top: 84px; }
@media (max-width: 600px) { .hide-sm { display: none; } }
.calls { display: grid; gap: 0; }
.call { display: grid; grid-template-columns: 62px 18px 92px minmax(0, 1fr); gap: 8px; padding: 7px 0; border-top: 1px solid var(--line); align-items: baseline; }
.call .t { color: var(--faint); }
.call .ok { color: var(--run); } .call .wait { color: var(--engineer); }
.call .name { font-weight: 600; }
@media (max-width: 600px) { .call { grid-template-columns: 62px 16px minmax(0, 1fr); } .call .d { grid-column: 1 / -1; } }
.call .d { min-width: 0; overflow-wrap: anywhere; }
.close { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 4px 10px; cursor: pointer; color: var(--muted); }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.err { color: var(--fail); }
</style>
</head>
<body>
<header>
  <span class="pulse" id="pulse" aria-hidden="true"></span>
  <h1>Orchestrate Monitor</h1>
  <span class="updated" id="updated" aria-live="polite">Connecting…</span>
  <span class="spacer"></span>
  <div class="controls">
    <label class="toggle"><input type="checkbox" id="runningOnly"> Running only</label>
    <div class="seg" role="group" aria-label="Time window" id="window">
      <button type="button" data-h="3">3h</button><button type="button" data-h="12" aria-pressed="true">12h</button><button type="button" data-h="48">2d</button>
    </div>
  </div>
</header>
<main>
  <nav class="list" id="list" aria-label="Sessions"></nav>
  <section class="detail" id="detail" aria-live="off"><div class="panel empty">Select a session.</div></section>
</main>
<script>
const state = { hours: 12, selected: localGet('session'), agent: null, data: null, runningOnly: false };
const STAGES = ['Pre-flight', 'Plan', 'Approve', 'Build', 'Final QA', 'Report'];
const $ = id => document.getElementById(id);

function localGet(key) { try { return localStorage.getItem('om.' + key); } catch { return null; } }
function localSet(key, value) { try { localStorage.setItem('om.' + key, value); } catch {} }
function esc(value) { return String(value ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function fmtTokens(n) { return n >= 1e6 ? (n / 1e6).toFixed(2) + 'M' : n >= 1e3 ? Math.round(n / 1e3) + 'k' : String(n || 0); }
function ago(seconds) { if (seconds < 5) return 'just now'; if (seconds < 60) return Math.round(seconds) + 's ago'; if (seconds < 3600) return Math.round(seconds / 60) + 'm ago'; if (seconds < 86400) return Math.round(seconds / 3600) + 'h ago'; return Math.round(seconds / 86400) + 'd ago'; }
function dur(ms) { const s = Math.max(0, Math.round(ms / 1000)); if (s < 60) return s + 's'; const m = Math.floor(s / 60); if (m < 60) return m + 'm ' + String(s % 60).padStart(2, '0') + 's'; return Math.floor(m / 60) + 'h ' + String(m % 60).padStart(2, '0') + 'm'; }
function time(ts) { return ts ? new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23' }) : ''; }
function shortModel(m) { return (m || '').replace(/^claude-/, '').replace(/-\d{8}$/, ''); }
function role(type) { return ['architect', 'engineer', 'qa'].includes(type) ? type : 'other'; }

async function poll() {
  try {
    const response = await fetch('/api/sessions?hours=' + state.hours, { cache: 'no-store' });
    if (!response.ok) throw new Error(response.status);
    state.data = await response.json();
    $('pulse').classList.remove('stale');
    $('updated').textContent = 'Updated ' + new Date().toLocaleTimeString();
    render();
  } catch (error) {
    $('pulse').classList.add('stale');
    $('updated').innerHTML = '<span class="err">Monitor server not reachable — is <span class="mono">orch ui</span> running?</span>';
  }
}

function render() {
  const now = state.data.now;
  let sessions = state.data.sessions;
  if (state.runningOnly) sessions = sessions.filter(s => s.status === 'running');
  $('list').innerHTML = sessions.length ? sessions.map(s => {
    const running = s.agents.filter(a => a.status === 'running').length;
    return `<button class="session" type="button" data-id="${esc(s.id)}" aria-current="${s.id === state.selected}">
      <span class="top"><span class="dot ${s.status}"></span>${esc(s.project)}${s.branch && s.branch !== 'HEAD' ? ' · ' + esc(s.branch) : ''}<span class="spacer"></span>${ago(now - s.mtime)}</span>
      <span class="title">${esc(s.title)}</span>
      <span class="meta"><span>${s.agents.length} agent${s.agents.length === 1 ? '' : 's'}${running ? ` · ${running} running` : ''}</span><span>${fmtTokens(s.total)} tokens</span>${s.runs.length ? `<span>${esc(s.runs[0].stage)}</span>` : ''}</span>
    </button>`;
  }).join('') : '<div class="empty">No sessions in this window.</div>';
  const current = state.data.sessions.find(s => s.id === state.selected) || sessions[0];
  if (!current) { $('detail').innerHTML = '<div class="panel empty">No sessions yet.</div>'; return; }
  if (current.id !== state.selected) { state.selected = current.id; markCurrent(); }
  renderDetail(current, now);
}

function markCurrent() { document.querySelectorAll('.session').forEach(el => el.setAttribute('aria-current', String(el.dataset.id === state.selected))); }

function renderDetail(s, now) {
  const models = Object.keys(s.models).map(shortModel).join(', ') || '—';
  const run = s.runs[0];
  let html = `<div class="panel">
    <h2>${esc(s.title)}</h2>
    <div class="facts"><span><span class="dot ${s.status}" style="display:inline-block"></span> <b>${s.status}</b></span><span>Project <b>${esc(s.project)}</b></span>${s.branch ? `<span>Branch <b>${esc(s.branch)}</b></span>` : ''}<span>Started <b>${time(s.started)}</b></span><span>Main model <b>${esc(models)}</b></span><span>Tokens <b>${fmtTokens(s.total)}</b> <span class="muted">+ ${fmtTokens(s.tokens.cache_read)} cache reads (main)</span></span></div>
    ${s.action ? `<div class="facts" style="margin-top:8px"><span>Now: <span class="mono">${esc(s.action)}</span></span></div>` : ''}
  </div>`;
  if (run) {
    const stopped = /stop/i.test(run.stage);
    const at = stopped ? -1 : STAGES.indexOf(run.stage);
    html += `<div class="panel"><h3>Pipeline · ${esc(run.slug)}</h3>
      <div class="stages">${STAGES.map((name, i) => `<div class="stage ${stopped ? (i === 0 ? 'stopped' : '') : i < at ? 'done' : i === at ? 'now' : ''}">${esc(name)}</div>`).join('')}</div>
      ${run.tasks.length ? `<div class="scroll"><table><thead><tr><th>Task</th><th>Model</th><th>State</th><th>QA</th><th class="num">Fix rounds</th></tr></thead><tbody>${run.tasks.map(t => `<tr><td>Task ${t.n}</td><td>${esc(t.model)}</td><td>${esc(t.state)}</td><td><span class="verdict ${esc(t.verdict)}">${esc(t.verdict || '—')}</span></td><td class="num">${t.rounds}</td></tr>`).join('')}</tbody></table></div>` : ''}
      ${run.usage.length ? `<details style="margin-top:12px"><summary>Usage by dispatch (${run.usage.length})</summary><div class="scroll"><table style="margin-top:8px"><thead><tr><th>When</th><th>Agent</th><th>Model</th><th class="num">Tokens</th><th>Note</th></tr></thead><tbody>${run.usage.map(u => `<tr><td>${esc(u.when)}</td><td>${esc(u.agent)}</td><td>${esc(u.model)}</td><td class="num">${esc(u.tokens)}</td><td>${esc(u.note)}</td></tr>`).join('')}</tbody></table></div></details>` : ''}
      <details style="margin-top:12px"><summary>Ledger (${run.lines.length} lines)</summary><pre class="mono">${esc(run.lines.join('\n'))}</pre></details>
    </div>`;
  }
  html += `<div class="panel"><h3>Agents</h3>${s.agents.length ? `<div class="scroll"><table><thead><tr><th>Agent</th><th>Task</th><th>Model</th><th>Status</th><th class="num">Time</th><th class="num">Calls</th><th class="num">Tokens</th><th class="hide-sm">Now / last</th></tr></thead><tbody>${s.agents.slice().reverse().map(a => {
    const end = a.status === 'running' ? now * 1000 : Date.parse(a.last);
    return `<tr class="agent" tabindex="0" data-path="${esc(a.path)}" aria-selected="${state.agent === a.path}">
      <td><span class="badge ${role(a.type)}">${esc(a.type)}</span></td><td>${esc(a.description)}</td><td>${esc(shortModel(a.model))}</td>
      <td><span class="status"><span class="dot ${a.status}"></span>${a.status}</span></td><td class="num">${a.started ? dur(end - Date.parse(a.started)) : ''}</td>
      <td class="num">${a.calls}</td><td class="num">${fmtTokens(a.total)}</td><td class="action mono hide-sm">${esc(a.action)}</td></tr>`;
  }).join('')}</tbody></table></div>` : '<div class="muted">No subagents in this session.</div>'}</div>`;
  html += `<div id="drawer"></div>`;
  $('detail').innerHTML = html;
  if (state.agent) loadAgent(state.agent, false);
}

async function loadAgent(path, scroll) {
  state.agent = path;
  document.querySelectorAll('tr.agent').forEach(el => el.setAttribute('aria-selected', String(el.dataset.path === path)));
  const drawer = $('drawer');
  if (!drawer) return;
  try {
    const response = await fetch('/api/agent?path=' + encodeURIComponent(path), { cache: 'no-store' });
    if (!response.ok) throw new Error(response.status);
    const d = await response.json();
    drawer.innerHTML = `<div class="panel drawer"><div class="row"><h3 style="margin:0">Tool calls (last ${d.calls.length})</h3><button class="close" type="button" id="closeDrawer">Close</button></div>
      <div class="calls">${d.calls.slice().reverse().map(c => `<div class="call"><span class="t mono">${time(c.ts)}</span><span class="${c.done ? 'ok' : 'wait'}" title="${c.done ? 'finished' : 'in progress'}">${c.done ? '✓' : '…'}</span><span class="name">${esc(c.name)}</span><span class="d mono" title="${esc(c.input)}">${esc(c.detail)}</span></div>`).join('') || '<div class="muted">No tool calls yet.</div>'}</div>
      ${d.final ? `<details open><summary>Latest message</summary><pre class="mono">${esc(d.final)}</pre></details>` : ''}</div>`;
    $('closeDrawer').onclick = () => { state.agent = null; drawer.innerHTML = ''; document.querySelectorAll('tr.agent').forEach(el => el.setAttribute('aria-selected', 'false')); };
    if (scroll) drawer.scrollIntoView({ behavior: 'smooth', block: 'start' });
  } catch { drawer.innerHTML = '<div class="panel err">Could not load this agent.</div>'; }
}

$('list').addEventListener('click', event => {
  const item = event.target.closest('.session');
  if (!item) return;
  state.selected = item.dataset.id; state.agent = null; localSet('session', state.selected); markCurrent(); render();
});
$('detail').addEventListener('click', event => { const row = event.target.closest('tr.agent'); if (row) loadAgent(row.dataset.path, true); });
$('detail').addEventListener('keydown', event => { const row = event.target.closest('tr.agent'); if (row && (event.key === 'Enter' || event.key === ' ')) { event.preventDefault(); loadAgent(row.dataset.path, true); } });
$('window').addEventListener('click', event => {
  const button = event.target.closest('button'); if (!button) return;
  state.hours = Number(button.dataset.h);
  document.querySelectorAll('#window button').forEach(b => b.setAttribute('aria-pressed', String(b === button)));
  poll();
});
$('runningOnly').addEventListener('change', event => { state.runningOnly = event.target.checked; if (state.data) render(); });
poll();
setInterval(poll, 3000);
</script>
</body>
</html>
